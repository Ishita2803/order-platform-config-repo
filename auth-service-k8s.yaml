# auth-service configuration for Kubernetes. Served by Config Server when the pod runs
# with SPRING_PROFILES_ACTIVE=k8s, layered on top of auth-service.yaml.
#
# Same reasoning as the other services' -k8s.yaml overlays: no discovery-service is
# deployed to the cluster, so the Eureka client must be off rather than left to retry a
# host that does not exist for the pod's whole lifetime.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
