server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    # Env-overridable so Docker Compose and GKE can point elsewhere without editing this
    # file. The default keeps a plain local run working with no environment set up.
    url: ${ORDER_DB_URL:jdbc:mysql://localhost:3306/order_db}
    # No default: a missing credential must fail loudly, not silently fall back to a
    # plaintext password committed in git.
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Do NOT stamp the Java class name into a __TypeId__ header. Event classes are
        # duplicated per service, so the producer's package name is meaningless to the
        # consumer and a type header would make deserialization fail outright. The wire
        # format is plain JSON, which is what a cross-service contract should be.
        spring.json.add.type.headers: false
      # Wait for all in-sync replicas. Single broker locally, but the setting is the one
      # that matters the moment there is more than one.
      acks: all

    consumer:
      group-id: order-service
      # Read from the beginning for a brand-new group, so a consumer started after a
      # producer does not silently miss the events already published.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # String, not JsonDeserializer: a StringJsonMessageConverter bean turns the payload
      # into whatever type each @KafkaListener method declares. One consumer can therefore
      # handle several event types without a container factory per topic.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  pattern:
    # Puts the correlation id on every log line -- same format as the gateway -- so a
    # search in Cloud Logging for one id finds this service's lines alongside every other
    # service's, for the same request.
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# ---------------------------------------------------------------------------------------
# Payment: the one synchronous call in the platform, and the only thing Resilience4j has to
# protect. Everything else goes through Kafka, where the broker already absorbs a slow peer.
# ---------------------------------------------------------------------------------------
payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8084}
  # A blocking call needs a bound. This is an HTTP read timeout rather than Resilience4j's
  # TimeLimiter, which needs a CompletableFuture to cancel and has nothing to cancel here.
  connect-timeout-ms: 1000
  read-timeout-ms: 2000

resilience4j:
  retry:
    instances:
      payment:
        # 3 attempts total, not 3 retries. Enough to ride out a blip; few enough that a
        # genuinely dead service is discovered in about a second rather than a minute.
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  circuitbreaker:
    instances:
      payment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Do not judge the service on one bad call: below this many, the breaker stays shut
        # regardless of the failure rate.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Open for 10s, then admit 2 trial calls. If they succeed the breaker closes; if not
        # it opens again. Short here so the behaviour is demonstrable in an interview.
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        # circuitbreakers exposes the live state (CLOSED / OPEN / HALF_OPEN), which is how
        # the failure demo is shown rather than asserted.
        include: health,info,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  # NOT management.otlp.tracing.* -- deprecated at error level as of Boot 4.0, silently
  # does not bind (see Agent.md trap #52).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

# Finishes orders that stalled half-way through the Saga -- see OrderReconciliationService.
#
# stuck-after must comfortably exceed normal settlement time, or the sweep starts racing the
# Kafka listener over orders that are still perfectly alive. That race is safe (the @Version
# column on Order settles it) but it is wasted work and noisy logs.
#
# give-up-after is the ceiling. Below it, an unreachable payment provider means "try again
# next sweep", because cancelling a backlog over a blip turns a temporary outage into
# permanently lost business. Above it, the order is cancelled and the stock released, because
# stock cannot be held indefinitely either.
reconciliation:
  interval-ms: ${RECONCILIATION_INTERVAL_MS:60000}
  initial-delay-ms: ${RECONCILIATION_INITIAL_DELAY_MS:60000}
  stuck-after-ms: ${RECONCILIATION_STUCK_AFTER_MS:300000}
  give-up-after-ms: ${RECONCILIATION_GIVE_UP_AFTER_MS:3600000}
  pending-stuck-after-ms: ${RECONCILIATION_PENDING_STUCK_AFTER_MS:600000}
  batch-size: ${RECONCILIATION_BATCH_SIZE:50}
