server:
  port: 8087

spring:
  application:
    name: customer-service

  datasource:
    # A second schema on the SAME instance as order_db/auth_db (order-mysql).
    url: ${CUSTOMER_DB_URL:jdbc:mysql://localhost:3316/customer_db}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

auth:
  base-url: ${AUTH_BASE_URL:http://localhost:8085}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
