server:
  port: 8083

spring:
  application:
    name: notification-service

  # No datasource, deliberately. This service has no JPA or MySQL dependency at all, so its
  # inability to read another service's tables is enforced by the classpath rather than by
  # good intentions.

  # Real email, via Gmail SMTP by default -- nothing here is Gmail-specific, any SMTP host
  # works. Credentials come from the impulse-secrets k8s Secret (MAIL_USERNAME/MAIL_PASSWORD),
  # never committed here. No default password: a missing credential must fail loudly at
  # startup (JavaMailSender construction), not silently send as an unauthenticated no-op.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      # Only ever used to republish to a dead-letter topic, so values are plain strings.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

    consumer:
      # A DIFFERENT group from order-service. Both services subscribe to the same two
      # topics, and because their group ids differ, Kafka delivers every event to both.
      # Sharing a group id would make them compete for messages and each order would be
      # notified or applied, but not both.
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

management:
  health:
    # Spring Boot auto-configures a mail health indicator that actually opens an SMTP
    # connection as part of /actuator/health -- which this pod's readiness/liveness
    # probes hit every 10-15s. Real email is a best-effort side channel here
    # (EmailNotificationSender already fails open on an SMTP error, same as
    # PaymentClient.generateInvoice), not something this service's own health should
    # depend on -- an email provider outage must not take down Kafka consumption too.
    mail:
      enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
