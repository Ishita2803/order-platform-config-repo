server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    # Env-overridable so Docker Compose and GKE can point elsewhere without editing this
    # file. The default keeps a plain local run working with no environment set up.
    url: ${INVENTORY_DB_URL:jdbc:mysql://localhost:3306/inventory_db}
    # No default: a missing credential must fail loudly, not silently fall back to a
    # plaintext password committed in git.
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # See order-service.yaml: event classes are duplicated per service, so a Java type
        # header on the wire would break the consumer rather than help it.
        spring.json.add.type.headers: false
      acks: all

    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Replays settlements that were dead-lettered, so a transient failure cannot strand stock.
#
# Run 1 of the benchmark proved this is needed: 200 orders against one product, nine
# confirmations exhausted the optimistic-lock retry budget, and their records landed in
# order.confirmed.DLT. Nothing read that topic, so nine units stayed reserved for ever against
# orders that were already CONFIRMED.
#
# The interval is deliberately unhurried. Consuming a dead letter immediately would retry it
# while whatever caused the failure is still happening; for lock contention, waiting is the
# entire fix.
settlement-recovery:
  interval-ms: ${SETTLEMENT_RECOVERY_INTERVAL_MS:120000}
  initial-delay-ms: ${SETTLEMENT_RECOVERY_INITIAL_DELAY_MS:120000}
  group-id: ${SETTLEMENT_RECOVERY_GROUP_ID:inventory-service-dlt-recovery}
  poll-timeout-ms: ${SETTLEMENT_RECOVERY_POLL_TIMEOUT_MS:5000}
  max-records: ${SETTLEMENT_RECOVERY_MAX_RECORDS:100}
