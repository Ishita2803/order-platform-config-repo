server:
  port: 8085

spring:
  application:
    name: auth-service

  datasource:
    # auth_db is a second schema + app user on the SAME MySQL instance order_db already
    # lives on (order-mysql), not a new MySQL instance -- Credential is a handful of rows,
    # and a whole extra mysqld process for that would be operationally wasteful on a
    # 4 GB data VM already running two databases and a Kafka broker.
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3316/auth_db}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

# No default -- a missing secret must fail loudly at startup, not silently sign tokens
# with a guessable value. Must match the gateway's jwt.secret exactly; both read from
# the same JWT_SECRET env var, sourced from the same Kubernetes Secret.
jwt:
  secret: ${JWT_SECRET}
  expiry-seconds: 3600

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  # NOT management.otlp.tracing.* -- that namespace is deprecated at error level as of
  # Boot 4.0 (silently does not bind at all; confirmed by reading
  # spring-boot-micrometer-tracing-opentelemetry's own configuration metadata after
  # traces never once reached Cloud Trace with the old property name). The real property
  # moved under management.opentelemetry.*, and its default transport is HTTP on 4318,
  # not gRPC on 4317 -- the endpoint needs the full /v1/traces path, matching the OTLP
  # HTTP exporter's historical convention.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    # This namespace (metrics, not tracing) is NOT deprecated -- confirmed separately.
    # spring-boot-starter-opentelemetry auto-configures a METRICS OTLP exporter too,
    # defaulting to localhost:4318 with nothing listening there -- Part D only wants
    # traces through the collector, not metrics, so turn that half off explicitly rather
    # than leave it retrying against nothing every export interval.
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,conditions,beans

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
