server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      server:
        # Note the namespace: this is the MVC/Servlet gateway
        # (spring-cloud-starter-gateway-server-webmvc), not WebFlux. Every tutorial using
        # `spring.cloud.gateway.routes` is for the reactive one and silently does nothing here.
        webmvc:
          routes:

            - id: order-service
              # lb:// resolves through Eureka. The k8s profile
              # (api-gateway-service-k8s.yaml) replaces this with a Service DNS name,
              # because Kubernetes already does discovery and Eureka is dropped there.
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                # /api/products/** also matches the bare /api/products, because in Spring's
                # PathPattern syntax /** matches zero or more segments.
                - Path=/api/products/**,/api/inventory/**

            # Only these two exact paths, not a blanket /auth/**. auth-service's
            # /auth/credentials (used by other services at onboarding time, Phase D2-D4)
            # is deliberately never reachable from outside the cluster -- same boundary
            # payment-service already relies on today.
            - id: auth-service-login
              uri: lb://auth-service
              predicates:
                - Path=/auth/login

            - id: auth-service-me
              uri: lb://auth-service
              predicates:
                - Path=/auth/me

            - id: vendor-service
              uri: lb://vendor-service
              predicates:
                - Path=/api/vendor/**

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customer/**

logging:
  pattern:
    # Puts the correlation id on every log line, so one request can be followed across the
    # gateway's own logs. CorrelationIdFilter is what populates the MDC.
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  # See auth-service.yaml: management.otlp.tracing.* is deprecated at error level as of
  # Boot 4.0 and silently does not bind. Default transport is HTTP on 4318 with the full
  # /v1/traces path, not gRPC on 4317.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    # Metrics namespace is NOT deprecated. Turns off the auto-configured
    # metrics-over-OTLP exporter, which otherwise retries against localhost:4318 with
    # nothing listening there.
    metrics:
      export:
        enabled: false

# Must match auth-service's jwt.secret exactly -- both read from the same JWT_SECRET
# env var, sourced from the same Kubernetes Secret (impulse-secrets).
jwt:
  secret: ${JWT_SECRET}

gateway:
  rate-limit:
    # Per-client-IP, fixed window. Generous enough that the benchmark client (Phase 11) and
    # any normal interview demo never trips it; tight enough to blunt a script hammering the
    # one endpoint this project exposes to the public internet (Phase 16).
    requests-per-window: 50
    window-seconds: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
